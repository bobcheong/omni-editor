# Builds a signed, installable APK and attaches it to the run.
# This is the path that needs no local build machine: push, wait, download to the phone,
# tap to install. Trigger it by hand, or by pushing a v* tag.
name: Release APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      # DIST-4: the same key must sign every build, or updates will not install over
      # the previous version. Store it as a base64 repository secret.
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.OMNI_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/omni-release.jks"

      - name: Build signed APK
        env:
          OMNI_KEYSTORE_FILE: ${{ runner.temp }}/omni-release.jks
          OMNI_KEYSTORE_PASSWORD: ${{ secrets.OMNI_KEYSTORE_PASSWORD }}
          OMNI_KEY_ALIAS: ${{ secrets.OMNI_KEY_ALIAS }}
          OMNI_KEY_PASSWORD: ${{ secrets.OMNI_KEY_PASSWORD }}
        run: ./gradlew assembleDirectRelease

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: omni-editor-direct-release
          path: app/build/outputs/apk/direct/release/*.apk
          retention-days: 30
