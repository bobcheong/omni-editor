name: CI
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      # CLAUDE.md: core modules must stay platform-independent.
      - name: Core purity
        run: ./gradlew checkCorePurity

      # DIST-5: both flavours stay green even though only `direct` ships.
      - name: Unit tests, both flavours
        run: ./gradlew testDirectDebugUnitTest testStoreDebugUnitTest :core:model:test :core:diff:test :core:io:test

      - name: Static analysis
        run: ./gradlew detekt :app-android:lintDirectDebug

      # Y-2: Accessibility check — lint rules promoted to error
      - name: Accessibility lint
        run: ./gradlew :app-android:lintDirectDebug -Pandroid.lint.checkOnly=Accessibility

      # X-2 / NFR-A1: IO boundary check
      - name: IO boundary
        run: ./gradlew checkIoBoundary

      - name: Assemble
        run: ./gradlew :app-android:assembleDirectDebug :app-android:assembleStoreDebug
