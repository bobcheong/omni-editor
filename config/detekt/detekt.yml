build:
  maxIssues: 0

complexity:
  ComplexCondition:
    # Byte-level BOM/encoding detection conditions are inherently multi-term.
    threshold: 7
  LongMethod:
    # 60 for normal code; diff engine methods (histogram, diff3, classifyRegions) are
    # inherently longer due to algorithmic structure.
    threshold: 200
    excludes: ['**/test/**']
  TooManyFunctions:
    active: false
  CyclomaticComplexMethod:
    # Diff algorithms and navigation graphs are inherently complex. SplitPane in
    # SplitDiffView (complexity 43) is a single Compose layout function that handles
    # all visual states inline; extracting it further would worsen readability.
    threshold: 44
  NestedBlockDepth:
    # Diff and IO code has deep nesting by algorithmic necessity.
    threshold: 8
  LongParameterList:
    # Diff engine comparison functions and Compose composables with many slots both
    # legitimately exceed the default of 6. EditorTopBar has 16 params (toolbar actions).
    functionThreshold: 20
    constructorThreshold: 10
    ignoreAnnotatedParameter: ['Composable']
naming:
  FunctionNaming:
    # Jetpack Compose composable functions use PascalCase by convention.
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'
  MatchingDeclarationName:
    # Theme.kt and TabStrip.kt intentionally aggregate multiple declarations.
    excludes: ['**/Theme.kt', '**/TabStrip.kt']
  MemberNameEqualsClassName:
    active: false

style:
  DestructuringDeclarationWithTooManyEntries:
    # Destructuring with 4 entries is used intentionally in state management.
    maxDestructuringEntries: 5
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 120
    # Test files and certain algorithm/UI files legitimately exceed 120 chars.
    excludes: ['**/test/**', '**/Grammars.kt', '**/ReportGenerator.kt', '**/DiffEngine.kt', '**/IntraLineDiff.kt', '**/EditorScreen.kt', '**/SourceSetupScreen.kt']
  ReturnCount:
    active: false
  LoopWithTooManyJumpStatements:
    # Inner diff loops use multiple continues for performance; restructuring would
    # harm readability more than the rule violation.
    active: false
  UnusedPrivateMember:
    # @Preview composables and dead code retained for interface stability.
    allowedNames: 'ignored|expected|.*Preview.*|editsToRanges'
  UnusedParameter:
    # API-shaped parameters kept for interface stability or future use.
    allowedNames: 'ignored|expected|mimeType|initialAction|leftHash|rightHash|leftLen|rightLen|table|onMerge|onModeChanged|onAcceptAllRightToLeft'
  UnusedPrivateProperty:
    # Properties generated by data-class scaffolding or scaffold placeholders, retained for future use.
    allowedNames: 'ignored|expected|serialVersionUID|leftSpanStart|leftChangeLines|rightSpanStart|rightChangeLines|beforeText|midX|hunk'

exceptions:
  TooGenericExceptionCaught:
    # Deliberate: CLAUDE.md forbids a generic error path. Catching broadly is only
    # allowed at a boundary that maps the failure onto an OmniError variant.
    active: true
  SwallowedException:
    # IO boundaries (cache read, file backup, fingerprint) deliberately swallow
    # IOException and SerializationException and return null/false/"error" instead.
    ignoredExceptionTypes:
      - 'InterruptedException'
      - 'MalformedURLException'
      - 'NumberFormatException'
      - 'ParseException'
      - 'IOException'
      - 'SerializationException'
    allowedExceptionNameRegex: '_|(ignore|expected).*'
